<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev Crossword</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel = "stylesheet" href="style.css">
    <script src="script.js" defer></script>
    
</head>
<body>

<header>
    <h1>WEB DEV <em>CROSSWORD</em></h1>
</header>

<div id="val-log"></div>

<div class="card">
    <div class="main-container">
        <div id="grid-wrap"><div id="grid"></div></div>
        <div class="divider"></div>
        <div class="clues-pane">
            <div class="dir-title">Across</div>
            <div id="across-list"></div>
            <div class="dir-title">Down</div>
            <div id="down-list"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-check"     onclick="checkAnswers()">Check Answers</button>
        <button class="btn-secondary" onclick="clearAll()">Clear</button>
    </div>

    <div id="status"></div>
</div>


</body>
</html>
